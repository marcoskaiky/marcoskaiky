name: Update profile art

# Retrato e cartao sao estaticos -- so mudam quando voce troca a foto ou o
# config. Aqui so o heatmap e regerado, entao o job instala apenas
# scripts/requirements.txt (requests + bs4), nao as libs de imagem.
"on":
  schedule:
    - cron: "17 6 * * *"   # ~06:17 UTC diariamente
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: false

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Buscar contribuicoes
        run: python scripts/fetch_contributions.py

      - name: Renderizar heatmap
        run: python scripts/render_heatmap_svg.py

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          # [skip ci] evita que o commit do proprio bot dispare o workflow de novo
          commit_message: "chore: refresh contribution graph [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg"
